<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display:grid;
        /* grid-template-columns:200px 200px auto;
        grid-template-rows:200px 200px 200px; 
        gap:20px; */
        grid-template:repeat(3,1fr) / repeat(3,1fr);
        gap:3px;
        

    }
    .box{
        background-color:pink;
        border:1px solid black;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    #item1{
        grid-column:1/4;
        grid-row:1/3;

    }
    #item4{
        grid-column:1/4;
    }
</style>
<body>
    <div id="item1" class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <div id="item4" class="box">D</div>
    <div class="box">E</div>
    <div class="box">F</div>
    <div class="box">G</div>

   

</body>
</html>
